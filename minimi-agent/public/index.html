<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --card:#fff; --line:#e7e5e4; --accent:#2563eb; --user:#eef2ff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111110; --fg:#e7e5e4; --muted:#a8a29e; --card:#1c1b1a; --line:#2e2c2a; --accent:#7aa2ff; --user:#1e2540; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header b { font-weight: 600; }
  button { font: inherit; cursor: pointer; }
  #new { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 4px 12px; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .msg.user { align-self: flex-end; background: var(--user); padding: 8px 14px; border-radius: 14px; max-width: 85%; white-space: pre-wrap; }
  .msg.bot { max-width: 100%; }
  .msg.bot p { margin: 0 0 10px; } .msg.bot table { border-collapse: collapse; display: block; overflow-x: auto; }
  .msg.bot th, .msg.bot td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
  .msg.bot a { color: var(--accent); }
  .status { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .src { margin-top: 8px; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
  .src a { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 10px; color: var(--muted); text-decoration: none; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer { padding: 12px 20px 20px; }
  form { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; max-height: 160px; }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 0 18px; }
  #send:disabled { opacity: .5; cursor: default; }
  .empty { color: var(--muted); text-align: center; margin-top: 15vh; }
</style>
</head>
<body>
<header><b>Chat agent</b><button id="new">New chat</button></header>
<main id="main"><div class="wrap" id="log"><div class="empty">Ask me anything. I search the web when it matters.</div></div></main>
<footer>
  <form id="form"><textarea id="input" rows="1" placeholder="Message…" autofocus></textarea><button id="send">Send</button></form>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), main = $("main"), input = $("input"), send = $("send");
let sid = localStorage.getItem("sid") || crypto.randomUUID();
localStorage.setItem("sid", sid);
let busy = false;

const md = (t, sources = []) => {
  // turn [n] into links to the matching source
  const withLinks = t.replace(/\[(\d+)\]/g, (m, n) => {
    const s = sources.find((x) => x.id === +n);
    return s ? `[${m}](${s.url})` : m;
  });
  return DOMPurify.sanitize(marked.parse(withLinks), { ADD_ATTR: ["target"] });
};
const srcRow = (sources) => sources.length
  ? `<div class="src">${sources.map((s) => `<a href="${encodeURI(s.url)}" target="_blank" rel="noopener" title="${s.title.replace(/"/g, "&quot;")}">[${s.id}] ${new URL(s.url).hostname.replace("www.", "")}</a>`).join("")}</div>` : "";
const add = (cls, html) => { document.querySelector(".empty")?.remove(); const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html; log.appendChild(d); main.scrollTop = main.scrollHeight; return d; };

(async () => {
  const turns = await (await fetch("/api/history?session=" + sid)).json();
  for (const t of turns) t.role === "user" ? add("user", "").textContent = t.text : add("bot", md(t.text, t.sources) + srcRow(t.sources || []));
})();

$("new").onclick = () => { sid = crypto.randomUUID(); localStorage.setItem("sid", sid); location.reload(); };
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message || busy) return;
  busy = true; send.disabled = true; input.value = ""; input.style.height = "auto";
  add("user", "").textContent = message;
  const bot = add("bot", `<div class="status">Thinking…</div><div class="body"></div>`);
  const status = bot.querySelector(".status"), body = bot.querySelector(".body");
  let text = "", sources = [];
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sessionId: sid, message }) });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, i).replace(/^data: /, ""); buf = buf.slice(i + 2);
        const ev = JSON.parse(line);
        if (ev.type === "status") status.textContent = ev.text;
        if (ev.type === "delta") { text += ev.text; body.innerHTML = md(text); status.style.display = "none"; }
        if (ev.type === "sources") sources = ev.sources;
        if (ev.type === "error") body.textContent = ev.text;
        main.scrollTop = main.scrollHeight;
      }
    }
    if (text) body.innerHTML = md(text, sources) + srcRow(sources);
  } catch { body.textContent = "Connection lost. Please try again."; }
  status.style.display = "none";
  busy = false; send.disabled = false; input.focus();
};
</script>
</body>
</html>
